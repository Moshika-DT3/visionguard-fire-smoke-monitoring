[pytest]
# This file lives in backend/ alongside the tests it configures. Tests are
# discovered under ./tests (backend/tests, relative to this file's
# directory, which pytest treats as rootdir). Application and test modules
# import their siblings using absolute "backend.*" import paths (for
# example "from backend.models import ..."), so the repository root (one
# directory up from this file) must also be importable; pythonpath adds it
# to sys.path for the pytest process regardless of the invoking shell's
# current working directory.
testpaths = tests
pythonpath = ..
