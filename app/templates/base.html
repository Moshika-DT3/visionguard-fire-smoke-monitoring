<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="VisionGuard Fire & Smoke Monitoring">
  <title>{% block title %}VisionGuard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('dashboard') }}" aria-label="VisionGuard dashboard">
      <span class="brand-mark" aria-hidden="true">VG</span>
      <span>
        <strong>VisionGuard</strong>
        <small>Fire &amp; Smoke Monitoring</small>
      </span>
    </a>
    <nav aria-label="Primary navigation">
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('cameras') }}">Camera Sources</a>
      <a href="{{ url_for('incidents') }}">Incident History</a>
      <a href="{{ url_for('status') }}">System Status</a>
    </nav>
  </header>

  <main class="page-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span>VisionGuard baseline demo</span>
    <span>Powered by Mock Detection Provider</span>
  </footer>
  <script src="{{ url_for('static', path='/js/dashboard.js') }}" defer></script>
</body>
</html>
